# Copy this file to config.yaml and adjust selectors if needed.
workspace_url: "https://workspace.refinitiv.com/web/Apps/research-next/?st=OAPermID#/?st=OAPermID"
input_file: "D:/20-temp/0422/lseg_request_by_call_2015_2018_end_plus_7d.txt"
download_dir: "output/downloads"
mapping_csv: "output/task_file_mapping.csv"
run_log_jsonl: "logs/run_log.jsonl"
daily_page_limit: 500

# Attach to an existing Chromium browser launched with --remote-debugging-port=9222
cdp_endpoint: "http://127.0.0.1:9222"

browser:
  headless: false
  slow_mo_ms: 200
  fallback_channel: "msedge"
  user_data_dir: "D:/edge-rpa-profile"

filters:
  broker: "Morgan Stanley"
  country: "USA"

timeouts:
  default_ms: 20000
  download_ms: 60000

behavior:
  apply_global_filters_once: true
  manual_setup_mode: false
  skip_initial_goto: false

selectors:
  company_input:
    - "input[placeholder*='Company' i]"
    - "input[aria-label*='Company' i]"
    - "[data-testid*='company' i] input"
  broker_input:
    - "input[placeholder*='Broker' i]"
    - "input[aria-label*='Broker' i]"
    - "[data-testid*='broker' i] input"
  country_input:
    - "input[placeholder*='Country' i]"
    - "input[aria-label*='Country' i]"
    - "[data-testid*='country' i] input"
  from_date_input:
    - "input[placeholder*='From' i]"
    - "input[aria-label*='From' i]"
    - "input[name*='from' i]"
  to_date_input:
    - "input[placeholder*='To' i]"
    - "input[aria-label*='To' i]"
    - "input[name*='to' i]"
  apply_buttons:
    - "button:has-text('Apply')"
    - "button:has-text('Search')"
    - "button:has-text('Run')"
  modify_query_buttons:
    - "button:has-text('MODIFY QUERY CONDITIONS')"
    - "button:has-text('MODIFY SEARCH CRITERIA')"
    - "button:has-text('Modify query conditions')"
    - "button:has-text('Modify search criteria')"
    - "text=/modify\\s+(query\\s+conditions|search\\s+criteria)/i"
  result_rows:
    - "[data-testid*='result' i] [role='row']"
    - "table tbody tr"
    - "[role='rowgroup'] [role='row']"
  next_page_buttons:
    - "button[aria-label*='Next' i]"
    - "button:has-text('Next')"
  download_buttons:
    - "button:has-text('Download')"
    - "a:has-text('Download')"
    - "button[aria-label*='download' i]"
    - "a[href*='.pdf' i]"
  pages_text:
    - "text=/\\b\\d+\\s*pages?\\b/i"
  report_title:
    - "[data-testid*='title' i]"
    - "h1"
    - "h2"
    - "[role='heading']"
  report_date:
    - "[data-testid*='date' i]"
    - "time"
    - "text=/\\b(20\\d{2}[-/]\\d{1,2}[-/]\\d{1,2}|\\d{1,2}[-/]\\d{1,2}[-/]20\\d{2})\\b/"
